name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.0 # keep in step with atlantis.yaml

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false
        working-directory: environments/services

      - name: terraform validate
        run: terraform validate
        working-directory: environments/services

  kubernetes:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum --check
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform

      - name: Validate manifests
        # Kubernetes version of the k3s cluster
        run: ./kubeconform -strict -summary -kubernetes-version 1.34.0 atlantis k8s
